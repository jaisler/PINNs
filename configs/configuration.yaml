# CONFIGURATION FILE 
# All paths are to be given without final slash.

# Path 
pathFlow: ''
pathMesh: ''
pathRes: ''
pathData: ''
pathModel: ''

# Flow field file
flowfield: 'flow.vtu'

# Geometry 
mesh: 'afrl2d.geo'

# Solver: Euler or RANS
equation: 'Euler'  

# Model: supervised or pinn
model: 'pinn'

# Device: cpu or cuda
device: cuda

# Save and load model 
model_name: model_pinn
load_model: False
save_model: True

# Verbose
verbose: True

# Routines
routine:
  sampling: True
  inference: True
  identification: False

plotflow:
  fields: ["Density", "Pressure", "Velocity", "Velocity"] 
  #fields: ["Density", "Pressure", "Velocity", "Velocity", "Eddy_Viscosity"]
  latex: ['$\rho$ $[kg/m^{3}]$', '$p$ $[Pa]$', '$u$ $[m/s]$', '$v$ $[m/s]$']
  #latex: ['$\rho$ $[kg/m^{3}]$', '$p$ $[Pa]$', '$u$ $[m/s]$', '$v$ $[m/s]$', '$\hat{\mu}_{t}$ $[kg/m \cdot s]$']
  comp: [0, 0, 0, 1]
  #comp: [0, 0, 0, 1, 0]
  cmap: ['bwr', 'bwr', 'bwr', 'bwr']
  #cmap: ['bwr', 'bwr', 'bwr', 'bwr', 'bwr']
  scale: [[0,1.3],[1.3e4,1.67e5],[-750, 950],[-315,315]]
  #scale: [[0,1.3],[1.3e4,1.67e5],[-750, 950],[-315,315],[0.0,0.05]]

# Sampling parameters
sampling:
  # Data points
  nspoin: 2100 # data
  nspoin_grad: 2300 # data
  nspoin_bc: [40, 260, 40, 160] # data
  # Collocation points for PINN
  nspoin_coll: 2100 # collocation points
  nspoin_coll_grad: 2300 # collocation points
  nspoin_coll_bc: [40, 260, 40, 160] # collocation points
  # Sampling type for inner points
  type: 'lhs' # random, lhs
  bc: ['inlet','bottom','outlet','top']
  # Sampling parameters
  grad_type_var: 'Density'
  pool_factor: 8
  alpha_grad_rho: 1.4
  # Plotting filename
  pldata: 'pl_data'
  plcoll: 'pl_coll'
  plall: 'pl_all'
  pltrain: 'pl_taining'
  # Data filename
  fdata: 'data_points'
  fcoll: 'collocation_points'

# NN setup
io_loss: 50
N_train_data: 3500
N_train_coll: 3500
N_val_data: 500
N_test_data: 500

# Neural network
# --------------
network:
  layers: [2, 32, 32, 32, 4]
  activation: "tanh"
  # Options: tanh, sigmoid, sin, softplus, silu/swish, gelu
  dropout:
    probability: 0.0
    hidden_layer_indices: [1, 2]

# Loss weights
loss_weights:
  w_rho: 1.0
  w_u: 1.0
  w_v: 200.0
  w_p: 4.0
  w_mut: 1.0
  w_f1: 1.0
  w_f2: 1.0
  w_f3: 1.0
  w_f4: 1.0

# Adam Optimizer
use_adam: True
n_adam_iter: 2000
lr_adam: 4e-4
scheduler_size: 2000
scheduler_gamma: 0.8

# LBFGS: start after adam optimizer finish
use_lbfgs: True
n_lbfgs_iter: 500
lr_lbfgs: 1.0
maxi_iter_lbfgs: 30

# Activation function: 
# Option: tahn, sigmoid, sin, softplus, silu/swish and gelu
activation: 'tanh' 

# General parameters
dims: 2

# Seed for rng
seed: 1234

# Physical parameters
# Heat capacity ratio 
gamma: 1.4
# Universal gas constant
R: 287.058 # N.m/kg.K
# Reference quatities
H: 0.0508
Lref: 0.0254 # m
# Dynamic viscosity - freestream
mu: 1.97E-5 #N.s/m^2
# Freestream condition
U_0: 727.0 # m/s
T: 327.0   # K
p: 61700.0   # Pa
rho: 0.657 # kg/m^3
# Turbulence modeling
k: 7884.91         # m^2/s^2
omega: 2.62957e+07 # 1/s
# Reynolds number
Re: 614149.0
# Mach Number
Ma: 2.0
# Prandtl lam.
Pr: 0.72
# Prandtl turb.
Prt: 0.9
# Sutherland parameters
T0: 273.15 # K
mu0: 1.716e-5 # Kg.s/m
S: 110.4 # K
