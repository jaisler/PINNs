# CONFIGURATION FILE 
# All paths are to be given without final slash.

# Path 
pathFlow: ''
pathMesh: ''
pathRes: ''
pathData: ''

# Flow field file
flowfield: 'flow.vtu' 
mesh: 'afrl2d.geo'

# Solver: Euler or RANS
equation: 'Euler'  

# Device: cpu or cuda
device: cuda

# Model: supervised or pinn
model: pinn

# Routines
routine:
  plotflow: True
  sampling: True
  inference: True
  identification: False

plotflow:
  fields: ["Density", "Pressure", "Velocity", "Velocity"]
  latex: ['$\rho$ $[kg/m^{3}]$', '$p$ $[Pa]$', '$u$ $[m/s]$', '$v$ $[m/s]$']
  comp: [0, 0, 0, 1]
  cmap: ['bwr', 'bwr', 'bwr', 'bwr']
  scale: [[0,1.3],[1.3e4,1.67e5],[-750, 950],[-315,315]]

# Sampling parameters
sampling:
  # Data points
  nspoin: 2100 # data
  nspoin_grad: 2300 # data
  nspoin_bc: [40, 260, 40, 160] # data
  # Collocation points for PINN
  nspoin_coll: 2100 # collocation points
  nspoin_coll_grad: 2300 # collocation points
  nspoin_coll_bc: [40, 260, 40, 160] # collocation points
  # Sampling type for inner points
  type: 'lhs' # random, lhs
  bc: ['inlet','bottom','outlet','top']
  grad_type_var: 'Density'
  pool_factor: 8
  alpha_grad_rho: 1.4
  seed: 1234
  fpoints: 'all_points'
  ftargets: 'target_points'
  fdata: 'sampling_data'
  fcoll: 'sampling_coll'

# NN setup
N_train_data: 1000
N_train_coll: 1000
N_AdamIter: 20000
layers: [2, 64, 64, 64, 64, 4]

# General parameters
dims: 2

# Physical parameters
# Heat capacity ratio 
gamma: 1.4
# Universal gas constant
R: 287.058 # N.m/kg.K
# Reference quatities
H: 0.0508
Lref: 0.0254 # m
# Dynamic viscosity - freestream
mu: 1.97E-5 #N.s/m^2
# Freestream condition
U_0: 727.0 # m/s
T: 327.0   # K
p: 61700.0   # Pa
rho: 0.657 # kg/m^3
# Turbulence modeling
k: 7884.91         # m^2/s^2
omega: 2.62957e+07 # 1/s
# Reynolds number
Re: 614149.0
# Mach Number
Ma: 2.0
# Prandtl lam.
Pr: 0.72
# Prandtl turb.
Prt: 0.9
# Sutherland parameters
T0: 273.15 # K
mu0: 1.716e-5 # Kg.s/m
S: 110.4 # K